# 1. 强制将所有 HTTP (80) 请求重定向到 HTTPS (443)
server {
    listen 80;
    server_name autodish.top www.autodish.top;
    return 301 https://$host$request_uri;
}

# 2. 配置 HTTPS 服务与反向代理
server {
    listen 443 ssl;
    server_name autodish.top www.autodish.top;

    # 绑定你上传的 SSL 证书和私钥路径
    ssl_certificate /etc/nginx/ssl/www.autodish.top.pem;
    ssl_certificate_key /etc/nginx/ssl/www.autodish.top.key;

    # 推荐的安全协议配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /var/www/html/autodish;
        index index.html index.htm;
    }
    location /api/ {
        # 将请求转发给本地 8080 端口的 Uvicorn 服务
        proxy_pass http://127.0.0.1:8080;
        
        # 传递真实的客户端 IP 和协议信息给后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 如果是 WebSocket 连接，需要加上这两行
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
